version: 2
updates:
  # Root app dependencies (Astro, Vitest, ESLint, ...)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
 
  # CDK infrastructure dependencies (aws-cdk-lib — your riskiest deps)
  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "daily"
 
  # GitHub Actions versions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
 
  # Docker base images (covers node:24-alpine once your Dockerfile exists)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

name: Apply Database Migrations

# Schema changes are not applied from a laptop (#96). The migrations live in the
# repository, so their delivery goes through the same manual gate the container
# deploy uses: this job parks on the `production` environment until a reviewer
# approves it, which records who applied which commit to the database.
#
# The CLI is the one pinned in package-lock.json, the same binary and version a
# developer runs for `supabase db reset`, so what a migration does locally is
# what it does to production.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      # Fails here, before the gate is approved, rather than after: a missing
      # secret is a configuration problem, not something a reviewer can decide.
      - name: Check the connection is configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "FAIL: repository secret SUPABASE_DB_URL is not set" >&2
            echo "Settings -> Secrets and variables -> Actions -> New repository secret" >&2
            exit 1
          fi

          # The port is the only part of the connection string reported, and it
          # is reported because it is the part that decides whether any of this
          # can work: a transaction pooler cannot run migrations, which need a
          # session connection.
          port=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^.*@[^/:]+:([0-9]+)/.*$#\1#')
          if [ "$port" = "6543" ]; then
            echo "FAIL: SUPABASE_DB_URL points at the transaction pooler (port 6543)." >&2
            echo "Use the session pooler on port 5432 (Supabase dashboard -> Connect)." >&2
            exit 1
          fi
          echo "Connection configured (port ${port:-default})"

      - name: Show the Supabase CLI version
        run: npx supabase --version

      # The two snapshots are what the summary is computed from. `--output-format
      # json` keeps them machine-readable; the CLI's progress lines go to stderr.
      - name: List migrations before the push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npx supabase migration list --db-url "$SUPABASE_DB_URL" --output-format json > "$RUNNER_TEMP/before.json"

      - name: Push pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # `db push` asks for confirmation. </dev/null makes it read EOF and take
          # its default (yes) rather than waiting for a terminal that is not there.
          npx supabase db push --db-url "$SUPABASE_DB_URL" < /dev/null

      - name: List migrations after the push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npx supabase migration list --db-url "$SUPABASE_DB_URL" --output-format json > "$RUNNER_TEMP/after.json"

      - name: Summarise the run
        run: |
          set -o pipefail
          node scripts/migration-report.mjs "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" |
            tee -a "$GITHUB_STEP_SUMMARY"

name: Continuous Integration

# Runs directly on pull requests, and is called by the release pipelines
# (`uses: ./.github/workflows/ci.yml`) so a release ships only what the gate
# approved. Pull requests keep the bare job names (`validate`, `container`,
# `infra`); only called runs get the `<caller job> / <job>` prefix.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Caches node_modules for high-speed runs

      - name: Install Project Dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Run Static Analysis & Tests
        run: |
          npm run lint
          npm run check
          npm run test:unit


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run container smoke test
        run: ./scripts/smoke-container.sh blog:ci


name: CI

on:
	push:
		branches: [main]
	pull_request:
		branches: [main]

jobs:
	quality:
		runs-on: ubuntu-latest

		steps:
			- name: Check out repository
			  uses: actions/checkout@v4

			- name: Set up Node.js
			  uses: actions/setup-node@v4
			  with:
				  node-version: 22.12.0
				  cache: npm

			- name: Install dependencies
			  run: npm ci

			- name: Lint
			  run: npm run lint

			- name: Run unit tests
			  run: npm run test:unit

			- name: Build site
			  run: npm run build
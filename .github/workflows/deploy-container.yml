name: Deploy Container to AWS

# Chained off the release pipeline rather than the raw push: the deploy only
# runs once the validated image for that commit exists in ECR.
on:
  workflow_run:
    workflows: ["Release Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Show released commit
        env:
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Deploying the image released for $RELEASED_SHA"
          echo "Release run: $RELEASE_RUN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service --cluster BlogCluster --service BlogService --force-new-deployment
          aws ecs wait services-stable --cluster BlogCluster --services BlogService

      - name: Post-deploy health check
        run: |
          APP_URL=$(aws cloudformation describe-stacks --stack-name EcsServiceStack \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          echo "Checking $APP_URL/api/health"
          curl -sf --retry 10 --retry-delay 5 --retry-all-errors "$APP_URL/api/health"

name: Deploy Static Site via AWS CDK

# Production deploy of the S3 + CloudFront site.
#
# Dependency-only pushes do not deploy. A lockfile or manifest bump is not a
# content change, and before this filter the Dependabot wave produced nine
# CloudFront deploys in four minutes with nothing new to serve — a dependency
# merge should not have the same production effect as a code change.
#
# The gate is unaffected: release-image.yml still runs `validate`, `container`
# and `infra` for every commit on main, including the ones skipped here. Only
# the deploy is skipped.
#
# Trade-off: a dependency bump can in principle change what is served (a new
# Astro version altering the built output, or a CDK library bump altering the
# synthesised StaticSiteStack template). That is why this workflow also has a
# manual trigger: dispatch it to deploy deliberately after such a change,
# rather than making every dependency merge redeploy by default.
#
# The filter covers the file sets Dependabot's four ecosystems actually move: the
# npm manifests and lockfiles, the action versions under .github, and the
# container base image. None of them can change what CloudFront serves, and each
# produced a deploy during the last dependency wave.
#
# It stays an ignore-list rather than becoming an allow-list of content paths,
# deliberately: an ignore-list fails open with a deploy nobody needed, an
# allow-list fails closed with a content change that silently never deploys.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'cdk/package.json'
      - 'cdk/package-lock.json'
      - '.github/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project & CDK Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Change to CDK folder
        working-directory: cdk
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: cdk
        run: npx cdk deploy StaticSiteStack --require-approval never
